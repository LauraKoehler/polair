[project]
name = "polair"
description = "processing of polar aircraft aerosol and turbulence data"
authors = [
    {name = "Laura Köhler", email = "laura.koehler@awi.de"},
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    "xarray",
    "numpy",
    "metpy",
    "scipy",
    "pyyaml",
    "netcdf4",
    "datetime",
    "dask",
    "pint_xarray",
]


[project.optional-dependencies]
tests = [
    "pytest",
    "black"
]
doc = [
    "sphinx",
    "myst-parser",
    "furo",
    ]

[project.scripts]
polair = "polair.cli:main"

[tool.setuptools]
packages = ["polair"]

[tool.setuptools.dynamic]
version = {attr = "polair.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
polair = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }

[tool.pixi.tasks]
docs = { cmd = "make html", cwd = "docs", default-environment = "doc" }
